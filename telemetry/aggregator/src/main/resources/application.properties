spring.application.name=aggregator

spring.kafka.bootstrap-servers=localhost:9092

kafka.consumer.group-id=aggregator

kafka.topics.sensors=telemetry.sensors.v1
kafka.topics.hubs=telemetry.hubs.v1
kafka.topics.snapshots=telemetry.snapshots.v1

logging.level.ru.yandex.practicum.aggregator=DEBUG
logging.level.org.apache.kafka=WARN

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s